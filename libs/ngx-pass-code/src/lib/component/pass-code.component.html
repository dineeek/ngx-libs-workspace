<!-- eslint-disable @angular-eslint/template/no-autofocus -->
<div
  class="container"
  [autofocus]="autofocus() && length() > 0"
  autofocusFirstInput
>
  <!-- eslint-enable @angular-eslint/template/no-autofocus -->
  @for (i of slotIndices(); track i) {
    <input
      [value]="slots()[i]"
      (input)="onSlotInput(i, $event)"
      (paste)="onSlotPaste($event)"
      (blur)="onSlotBlur()"
      onclick="select()"
      [autoblur]="autoblur()"
      [type]="type()"
      [uppercase]="uppercase()"
      [disabled]="disabled()"
      [class.invalid-input]="isInvalid()"
      maxlength="1"
      focusNextPreviousInput
      transformInputValue
    />
  }
</div>
