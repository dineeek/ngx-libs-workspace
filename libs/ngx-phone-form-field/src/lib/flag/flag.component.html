@if (svg(); as html) {
  <span
    class="flag"
    [innerHTML]="html"
    role="img"
    [attr.aria-label]="label()"
  ></span>
} @else {
  <span class="flag flag--unknown" role="img" [attr.aria-label]="label()">
    <svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true">
      <circle
        cx="12"
        cy="12"
        r="10"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      />
      <path
        d="M2 12h20M12 2c3 3 4.5 6.5 4.5 10S15 19 12 22M12 2c-3 3-4.5 6.5-4.5 10S9 19 12 22"
        fill="none"
        stroke="currentColor"
        stroke-width="1.2"
      />
    </svg>
  </span>
}
